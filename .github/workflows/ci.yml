name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "img/**"
      - "LICENSE"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "img/**"
      - "LICENSE"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: 判断镜像是否需要重建
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.check.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        name: 检查镜像相关文件是否有改动
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
            head=$PR_HEAD
          elif [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
            head=$HEAD_SHA
          else
            echo "无法比较改动（标签、手动触发、新分支或历史被改写），直接构建"
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base...$head")
          pattern='^(qqcache/|docker/|webui/server/|webui/public/|webui/package(-lock)?\.json$|\.dockerignore$'
          if [ "$EVENT" = pull_request ]; then pattern+='|\.github/workflows/ci\.yml$'; fi
          pattern+=')'
          if grep -Eq "$pattern" <<< "$files"; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-atspi-2.0 python3-dbus python3-loguru shellcheck

      - name: 单元测试
        run: /usr/bin/python3 -m unittest discover -s tests

      - name: shellcheck
        run: shellcheck -S warning docker/*.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: WebUI 语法检查
        run: |
          npm ci --prefix webui --omit=dev --no-audit --no-fund
          find webui/server webui/public -name '*.js' -print0 | xargs -0 -n1 node --check

  image:
    needs: [changes, test]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 镜像名
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/whiskerwind" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: 构建
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: whiskerwind:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冷启动冒烟测试
        run: QQ_IMAGE=whiskerwind:ci docker/smoke.sh

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送到 ghcr
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
