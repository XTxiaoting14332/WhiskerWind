name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-atspi-2.0 python3-dbus python3-loguru shellcheck

      - name: 单元测试
        run: /usr/bin/python3 -m unittest discover -s tests

      - name: shellcheck
        run: shellcheck -S warning docker/*.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: WebUI 语法检查
        run: |
          npm ci --prefix webui --omit=dev --no-audit --no-fund
          find webui/server webui/public -name '*.js' -print0 | xargs -0 -n1 node --check

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 镜像名
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/whiskerwind" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: 构建
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: whiskerwind:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冷启动冒烟测试
        run: QQ_IMAGE=whiskerwind:ci docker/smoke.sh

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送到 ghcr
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
